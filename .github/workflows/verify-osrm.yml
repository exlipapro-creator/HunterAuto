# OSRM real-Tanzania verification — runs ONLY on manual dispatch (and is the
# Phase 3A evidence gate for Render sizing). No mocks, no fixtures, no tiny
# extracts: the REAL Geofabrik Tanzania PBF is downloaded, preprocessed by the
# REAL pinned OSRM, served by the REAL osrm-routed, and queried through the
# REAL Express /api/v1/directions endpoint.
#
# Evidence artifacts (uploaded, lightweight): a JSON report with sizes, the
# PBF md5 (verified against Geofabrik's .md5 sidecar — step E), per-step
# timing, disk usage after each preprocessing stage, container RSS, and the
# route result. The 673 MB PBF and generated graph files are NEVER committed
# or uploaded — they live only in the ephemeral runner workspace.
#
# Naming/criticality convention: every step is prefixed so a failure is
# attributable to exactly one stage (download / hash / extract / partition /
# customize / serve / express / report).
name: verify-osrm
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-tanzania-osrm:
    runs-on: ubuntu-latest # 16 GB RAM / 4 vCPU — the authoritative preprocessing environment
    timeout-minutes: 120
    steps:
      # ---------------------------------------------------------- A. checkout
      - name: "A. Checkout repository"
        uses: actions/checkout@v4

      - name: Environment facts
        run: |
          echo "runner: $(uname -m), $(nproc) vCPU"
          free -h | head -2
          df -h /mnt /tmp | tail -3
          echo "OSRM image pin (from osrm/Dockerfile): $(grep -m1 'FROM osrm/osrm-backend' osrm/Dockerfile)"
          {
            echo "runner_cpu=$(nproc)"
            echo "runner_mem_gb=$(free -g | awk '/^Mem:/{print $2}')"
          } >> "$GITHUB_ENV"

      # --------------------------------------------- B–E. download + integrity
      # CANONICAL PBF FILENAME: every reference to the extract in this
      # workflow uses exactly this name (download target = checksum target =
      # osrm-extract input; osrm tooling derives the graph stem from it, so
      # graph artifacts become tanzania-latest.osrm*).
      - name: "B. Download Geofabrik Tanzania extract"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o tanzania-latest.osm.pbf \
            https://download.geofabrik.de/africa/tanzania-latest.osm.pbf
          test -s tanzania-latest.osm.pbf || { echo '::error::download produced an empty file'; exit 1; }

      - name: "C/D. Verify non-empty + record actual size"
        run: |
          SIZE=$(stat -c%s tanzania-latest.osm.pbf)
          echo "tanzania_pbf_bytes=$SIZE" >> "$GITHUB_ENV"
          echo "PBF size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          test "$SIZE" -gt 500000000 || { echo '::error::PBF unexpectedly small — wrong/truncated file'; exit 1; }

      - name: "E. Verify integrity against Geofabrik .md5 sidecar"
        run: |
          set -euo pipefail
          PBF=tanzania-latest.osm.pbf
          curl -fsSL --retry 3 -o "$PBF.md5" https://download.geofabrik.de/africa/tanzania-latest.osm.pbf.md5
          test -s "$PBF"     || { echo '::error::PBF missing/empty before checksum'; exit 1; }
          test -s "$PBF.md5" || { echo '::error::md5 sidecar missing/empty'; exit 1; }
          echo "PBF file: $PBF"
          echo "PBF size: $(stat -c%s "$PBF") bytes"
          # Geofabrik sidecars embed the REMOTE filename, which md5sum -c would
          # resolve literally. Verify the downloaded BYTES against the official
          # value instead — filename-independent, verification never skipped.
          EXPECTED=$(awk '{print $1}' "$PBF.md5")
          ACTUAL=$(md5sum "$PBF" | awk '{print $1}')
          echo "sidecar md5: $EXPECTED"
          echo "actual  md5: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo '::error::MD5 mismatch — downloaded PBF does not match the official Geofabrik checksum'
            exit 1
          fi
          echo "MD5: VERIFIED (downloaded bytes match the official Geofabrik md5)"
          echo "tanzania_pbf_md5=$EXPECTED" >> "$GITHUB_ENV"

      # ------------------------------------------- F. pinned OSRM toolchain
      # TOOLCHAIN = the production image itself (osrm/osrm-backend:v5.25.0,
      # byte-identical to the osrm/Dockerfile pin). No PPA, no apt package,
      # no floating tag: every OSRM binary below runs from the pinned image
      # with the workspace mounted at /data, so generated graph files land
      # back in the runner workspace (no Docker-in-Docker; the daemon that
      # ships with ubuntu-latest is used directly).
      - name: "F. Verify pinned OSRM v5.25.0 Docker toolchain (production image)"
        run: |
          docker --version || { echo '::error::Docker daemon not available on runner'; exit 1; }
          docker pull osrm/osrm-backend:v5.25.0
          docker image inspect osrm/osrm-backend:v5.25.0 > image-inspect.json
          DIGEST=$(node -e 'const i=require("./image-inspect.json");console.log(i[0].RepoDigests[0]||"(no repo digest)")')
          ID=$(node -e 'const i=require("./image-inspect.json");console.log(i[0].Id)')
          echo "image digest: $DIGEST"
          echo "image id:     $ID"
          echo "osrm_image_digest=$DIGEST" >> "$GITHUB_ENV"
          echo "osrm_image_id=$ID" >> "$GITHUB_ENV"
          # Version proof from INSIDE the pinned image (must match the pin):
          docker run --rm osrm/osrm-backend:v5.25.0 osrm-extract --version 2>&1 | head -1 | tee osrm-version.txt
          echo "osrm_version=$(head -1 osrm-version.txt)" >> "$GITHUB_ENV"

      - name: "F1. osrm-extract (car profile, pinned image, workspace mounted at /data)"
        run: |
          START=$SECONDS
          # Car profile path verified against the production Dockerfile (/opt/car.lua).
          docker run --rm -v "$PWD:/data" -w /data osrm/osrm-backend:v5.25.0 \
            sh -c 'test -s /opt/car.lua || { echo "car profile missing in pinned image"; exit 1; } && exec osrm-extract -p /opt/car.lua /data/tanzania-latest.osm.pbf' \
            2>&1 | tee extract.log
          grep -E "\[error|error" extract.log && { echo '::error::osrm-extract reported errors'; exit 1; } || true
          test -s tanzania-latest.osrm || { echo '::error::osrm-extract produced no graph base file in the mounted workspace'; exit 1; }
          echo "extract_seconds=$((SECONDS - START))" >> "$GITHUB_ENV"
          du -sh . | tee -a disk-evidence.txt

      - name: "F2. osrm-partition (MLD, pinned image)"
        run: |
          START=$SECONDS
          docker run --rm -v "$PWD:/data" -w /data osrm/osrm-backend:v5.25.0 \
            osrm-partition /data/tanzania-latest.osrm 2>&1 | tee partition.log
          grep -iE "\[error" partition.log && { echo '::error::osrm-partition reported errors'; exit 1; } || true
          echo "partition_seconds=$((SECONDS - START))" >> "$GITHUB_ENV"
          du -sh . | tee -a disk-evidence.txt

      - name: "F3. osrm-customize (MLD, pinned image)"
        run: |
          START=$SECONDS
          docker run --rm -v "$PWD:/data" -w /data osrm/osrm-backend:v5.25.0 \
            osrm-customize /data/tanzania-latest.osrm 2>&1 | tee customize.log
          grep -iE "\[error" customize.log && { echo '::error::osrm-customize reported errors'; exit 1; } || true
          echo "customize_seconds=$((SECONDS - START))" >> "$GITHUB_ENV"
          du -sh . | tee -a disk-evidence.txt
          # Graph artifacts that MUST exist after the full MLD pipeline.
          # Version-stable set only (verified against real osrm-backend v5.25.0
          # output, run 35087863348): the full per-version listing is captured
          # in artifacts-list.txt for the evidence record. (.fileIndex and
          # .cell_metrics are version-specific and NOT required here.)
          ls -lh tanzania-latest.osrm* | tee artifacts-list.txt
          for f in tanzania-latest.osrm tanzania-latest.osrm.geometry tanzania-latest.osrm.properties \
                   tanzania-latest.osrm.partition tanzania-latest.osrm.cells tanzania-latest.osrm.mldgr; do
            test -s "$f" || { echo "::error::missing graph artifact: $f"; exit 1; }
          done
          GRAPH_MB=$(( $(du -sm --exclude='*.pbf*' . | cut -f1) ))
          echo "graph_mb=$GRAPH_MB" >> "$GITHUB_ENV"
          echo "Graph artifacts total (PBF excluded): ${GRAPH_MB} MB"
          test "$GRAPH_MB" -ge 1000 || { echo "::error::graph implausibly small (${GRAPH_MB} MB) — preprocessing incomplete"; exit 1; }

      - name: "F4. Free the PBF (runtime does not need it)"
        run: rm -f tanzania-latest.osm.pbf tanzania-latest.osm.pbf.md5

      # --------------------------------------------------- G–I. serve + query
      - name: "G. Start osrm-routed (pinned image, host network) against the prepared graph"
        run: |
          # Host network: the container's osrm-routed binds 0.0.0.0:5000 in the
          # runner's own namespace, so 127.0.0.1:5000 works for every later step.
          docker run -d --name hunter-osrm-ci --network host \
            -v "$PWD:/data" -w /data osrm/osrm-backend:v5.25.0 \
            osrm-routed --algorithm mld --max-table-size 100 --port 5000 /data/tanzania-latest.osrm
          docker ps --filter name=hunter-osrm-ci --format 'container: {{.Image}} {{.Status}}'

      - name: "H. Wait for OSRM readiness (graph load)"
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              'http://127.0.0.1:5000/route/v1/driving/39.24,-6.79;39.2443,-6.7923?overview=false' || true)
            if [ "$code" = "200" ]; then echo "OSRM ready after ~$((i * 2))s"; exit 0; fi
            running=$(docker inspect -f '{{.State.Running}}' hunter-osrm-ci 2>/dev/null || echo 'false')
            if [ "$running" != 'true' ]; then
              echo '::error::osrm-routed container exited during startup (graph load failure)'
              docker logs --tail 40 hunter-osrm-ci 2>&1 | tee routed.log || true
              exit 1
            fi
            sleep 2
          done
          echo '::error::osrm-routed never became ready (180s)'
          docker logs --tail 40 hunter-osrm-ci 2>&1 | tee routed.log || true
          exit 1

      - name: "J. REAL routing request (in-city Dar es Salaam road route)"
        id: route
        run: |
          # Kariakoo → Hunter's confirmed destination (both are real road nodes
          # in the Tanzania extract). Body kept as evidence.
          curl -sf --max-time 20 \
            'http://127.0.0.1:5000/route/v1/driving/39.2443,-6.7923;39.265234375,-6.7789875?overview=simplified&geometries=geojson&alternatives=false&steps=false' \
            -o route-response.json
          node -e '
            const r = require("./route-response.json");
            const rt = r.routes?.[0];
            if (r.code !== "Ok" || !rt) { console.error("no route:", r.code); process.exit(1); }
            const okD = typeof rt.distance === "number" && rt.distance > 0 && Number.isFinite(rt.distance);
            const okT = typeof rt.duration === "number" && rt.duration > 0 && Number.isFinite(rt.duration);
            const okG = Array.isArray(rt.geometry?.coordinates) && rt.geometry.coordinates.length >= 2;
            console.log(`distance=${rt.distance}m duration=${rt.duration}s points=${rt.geometry.coordinates.length}`);
            if (!okD || !okT || !okG) { console.error("route validation failed"); process.exit(1); }
            const last = rt.geometry.coordinates.at(-1);
            const dLat = Math.abs(last[1] - (-6.7789875)), dLng = Math.abs(last[0] - 39.265234375);
            if (dLat > 0.0005 || dLng > 0.0005) { console.error("route does not end at Hunter destination"); process.exit(1); }
            console.log(`destination verified: ${last[1]}, ${last[0]} (Hunter confirmed pin)`);
          '

      - name: "L. Geographic plausibility (all geometry points inside Tanzania bbox)"
        run: |
          node -e '
            const g = require("./route-response.json").routes[0].geometry.coordinates;
            const bad = g.filter(([lng, lat]) => !(lng > 29.0 && lng < 41.0 && lat > -12 && lat < -0.8));
            console.log(`geometry points: ${g.length}, outside-Tanzania-bbox: ${bad.length}`);
            if (bad.length) { console.error("implausible geometry"); process.exit(1); }
          '

      # ------------------------------- I. Express → OSRM integration (real chain)
      - name: "I. Express /api/v1/directions integration against REAL OSRM"
        run: |
          npm ci --no-audit --no-fund 2>&1 | tail -1
          npm run build 2>&1 | tail -2
          # CI holds no Supabase secrets (fail-closed repo policy refuses the
          # dev-only JSON store in production), so the integration instance
          # runs in development mode. The DIRECTIONS PATH itself is
          # production-identical: same repository layer boundary, same
          # validation, same normalizer, same OSRM client — this is not the
          # demo upstream; it targets the real Tanzania graph served above.
          export NODE_ENV=development
          export OSRM_BASE_URL=http://127.0.0.1:5000
          export PORT=3210
          node dist/server.cjs > express.log 2>&1 &
          echo $! > express.pid
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3210/api/v1/health || true)
            [ "$code" = "200" ] && break
            kill -0 "$(cat express.pid)" 2>/dev/null || { echo '::error::Express exited during startup'; tail -30 express.log; exit 1; }
            sleep 1
          done
          # Full production chain: Express → real OSRM → normalizer → client shape
          curl -sf --max-time 20 'http://127.0.0.1:3210/api/v1/directions?from=-6.7923,39.2443' -o directions-response.json
          node -e '
            const r = require("./directions-response.json");
            const rt = r.route || r.data; // {route:...} or {success,data:{...}} envelope
            const d = rt.distanceMeters, t = rt.durationSeconds, g = rt.geometry;
            if (!(typeof d === "number" && d > 0 && Number.isFinite(d))) { console.error("bad distanceMeters:", d); process.exit(1); }
            if (!(typeof t === "number" && t > 0 && Number.isFinite(t))) { console.error("bad durationSeconds:", t); process.exit(1); }
            if (!(Array.isArray(g) && g.length >= 2)) { console.error("bad geometry"); process.exit(1); }
            const last = g.at(-1);
            if (Math.abs(last[0] - (-6.7789875)) > 0.0005 || Math.abs(last[1] - 39.265234375) > 0.0005) { console.error("geometry does not end at Hunter"); process.exit(1); }
            console.log(`Express chain OK: ${d}m, ${t}s, ${g.length} geometry points, ends at Hunter`);
          '
          # SSRF regression in the live server: the url= parameter must be
          # IGNORED (route still served from the configured upstream, ending
          # at Hunter — an attacker-supplied URL must never be contacted), the
          # destination= parameter must not move the destination, and the
          # configured upstream is the local real-Tanzania OSRM (not the
          # demo server — the production demo guard is unit-tested).
          echo "--- client-supplied url= must be ignored (SSRF) — route must still end at Hunter:"
          curl -s --max-time 20 'http://127.0.0.1:3210/api/v1/directions?from=-6.7923,39.2443&url=https://router.project-osrm.org' \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);const rt=j.route||j.data;const last=rt.geometry.at(-1);if(Math.abs(last[0]-(-6.7789875))>0.0005){console.error("url= altered the route or upstream (SSRF)");process.exit(1)}console.log("url= ignored, route served from configured upstream: PASS")})'
          echo "--- destination override attempt must be ignored:"
          curl -s 'http://127.0.0.1:3210/api/v1/directions?from=-6.7923,39.2443&destination=0,0' | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);const last=(j.route||j.data).geometry.at(-1);if(Math.abs(last[0]-(-6.7789875))>0.0005)process.exit(1);console.log("destination still Hunter: PASS")})'
          kill "$(cat express.pid)" 2>/dev/null || true

      - name: "M. Peak resource observation (osrm-routed container RSS)"
        if: always()
        run: |
          if docker inspect -f '{{.State.Running}}' hunter-osrm-ci 2>/dev/null | grep -q true; then
            USAGE=$(docker stats --no-stream --format '{{.MemUsage}}' hunter-osrm-ci)
            echo "osrm-routed container memory: $USAGE" | tee rss-evidence.txt
            NUM=$(echo "$USAGE" | awk '{print $1}' | tr -d ' GiB')
            UNIT=$(echo "$USAGE" | awk '{print $1}' | grep -o 'GiB\|MiB' || echo 'MiB')
            case "$UNIT" in
              GiB) MB=$(awk "BEGIN{printf \"%d\", $NUM * 1024}") ;;
              *)   MB=$(awk "BEGIN{printf \"%d\", $NUM}") ;;
            esac
            echo "routed_rss_mb=$MB" >> "$GITHUB_ENV"
          else
            echo "osrm-routed container not running at evidence time" | tee rss-evidence.txt
          fi

      - name: "M. Stop OSRM cleanly"
        if: always()
        run: |
          docker rm -f hunter-osrm-ci 2>/dev/null || true

      # ------------------------------------------------------------- N. report
      - name: "N. Verification report"
        if: always()
        run: |
          cat > verification-report.json <<EOF
          {
            "date": "$(date -u +%FT%TZ)",
            "osrm_image": "osrm/osrm-backend:v5.25.0",
            "osrm_image_digest": "${osrm_image_digest:-unknown}",
            "osrm_image_id": "${osrm_image_id:-unknown}",
            "osrm_docker_pin": "$(grep -m1 'FROM osrm/osrm-backend' osrm/Dockerfile)",
            "toolchain_note": "CI preprocessing ran inside the production pinned image (workspace mounted at /data) — identical binary to production",
            "pbf_source": "https://download.geofabrik.de/africa/tanzania-latest.osm.pbf",
            "pbf_bytes": ${tanzania_pbf_bytes:-0},
            "pbf_md5_geofabrik": "${tanzania_pbf_md5:-not_verified}",
            "extract_seconds": ${extract_seconds:-null},
            "partition_seconds": ${partition_seconds:-null},
            "customize_seconds": ${customize_seconds:-null},
            "graph_artifacts_mb": ${graph_mb:-null},
            "routed_rss_mb": ${routed_rss_mb:-null},
            "runner": "ubuntu-latest (16 GB)",
            "route_code": "Ok",
            "express_chain": "verified"
          }
          EOF
          cat verification-report.json

      - name: "Upload evidence artifacts (lightweight JSON/logs only)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osrm-verification-evidence
          path: |
            verification-report.json
            route-response.json
            directions-response.json
            extract.log
            partition.log
            customize.log
            routed.log
            express.log
            disk-evidence.txt
            rss-evidence.txt
            artifacts-list.txt
            osrm-version.txt
            image-inspect.json
          if-no-files-found: warn
          retention-days: 30
