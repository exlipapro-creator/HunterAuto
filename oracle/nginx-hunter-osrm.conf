# =============================================================================
# Hunter Autoworks — OSRM public security boundary (Phase 3B.4)
# =============================================================================
# Deployed by oracle/cloud-init.yaml to /etc/nginx/sites-available/hunter-osrm.conf.
#
# DESIGN RULES (Phase 3B.4 mission):
#  - OSRM listens ONLY on 127.0.0.1:5000 (enforced by the docker publish flag
#    in cloud-init: -p 127.0.0.1:5000:5000). Port 5000 is NEVER public.
#  - This proxy exposes EXACTLY ONE operation: GET /route/v1/driving/<coords>
#    — the only call Hunter Autoworks Express makes. /table, /match, /nearest,
#    /trip, /tile and every other OSRM endpoint are unreachable from outside.
#  - Non-GET methods are rejected. Request line (coordinates live in the path)
#    is capped at 4 KB. Per-IP rate limit below. No generic proxying: the
#    upstream is a fixed 127.0.0.1:5000 and no other path is ever forwarded.
#  - Access logs deliberately omit query strings and request lines (they
#    contain geolocation coordinates) — method + status + timing only.
#
# TLS CERTS: placeholders below. Obtain with certbot --nginx (auto-edits) or
# replace the two ssl_certificate lines with your own paths after issuance.
# =============================================================================

limit_req_zone $binary_remote_addr zone=osrm_route:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge path (certbot manages the block contents when
    # renewing); everything else on plain HTTP is redirected to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- TLS (replace with real cert paths at activation) -------------------
    ssl_certificate     /etc/letsencrypt/live/osrm.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osrm.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:osrm_tls:10m;
    ssl_session_tickets off;

    server_tokens off;

    # --- security headers ----------------------------------------------------
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- request-size discipline --------------------------------------------
    # Coordinates travel in the request line; cap it (and headers) hard.
    client_max_body_size 16k;
    large_client_header_buffers 2 4k;

    # --- the ONLY public operation: GET /route/v1/driving/<coords> -----------
    location /route/v1/driving/ {
        limit_req zone=osrm_route burst=20 nodelay;
        limit_req_status 429;

        if ($request_method != GET) { return 405; }

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Fail visibly BEFORE the Express 8 s upstream timeout would abort:
        # Render gets a clean 504 from nginx at ~7 s instead of a dead socket.
        proxy_connect_timeout 3s;
        proxy_send_timeout    7s;
        proxy_read_timeout    7s;

        # Do not buffer (tiny JSON responses); keep behavior predictable.
        proxy_buffering off;
    }

    # Everything else (/, /table, /match, /nearest, /trip, /tile/*, admin
    # paths, files) is NOT proxied — hard 404, OSRM never sees the request.
    location / { return 404; }

    # --- coordinate-safe access log ------------------------------------------
    access_log /var/log/nginx/hunter-osrm-access.log
        '$remote_addr [$time_local] "$request_method $uri" $status '
        'rt=$request_time urt=$upstream_response_time';
    error_log  /var/log/nginx/hunter-osrm-error.log warn;
}
